# Tempo monolithic mode with S3 (MinIO) backend.
# Ports: 3200 = HTTP query/health, 4327/4328 = OTLP receivers (renamed from the
# 4317/4318 defaults so they don't collide with the OTel collector).

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

# We accept both OTLP transports so the collector can pick either.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m           # small blocks for a lively local demo

compactor:
  compaction:
    block_retention: 24h            # short retention for a dev stack

# S3 (MinIO) backend for durable trace blocks.
storage:
  trace:
    backend: s3
    s3:
      endpoint: minio-lgtm:9000
      bucket: tempo-data
      access_key: lgtmadmin
      secret_key: lgtmadmin123
      insecure: true
      forcepathstyle: true
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Metrics generator turns spans into RED-style metrics that Grafana can plot alongside
# metric queries. Points at Mimir via remote_write so span-rate is queryable.
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: slo-shipper
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://mimir:9009/api/v1/push
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]

usage_report:
  reporting_enabled: false
