# Provisioned Prometheus datasource — the main stack's Prometheus (docker-compose.yml).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # Main stack Prometheus via its published port; set in docker-compose.lgtm.yml.
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
